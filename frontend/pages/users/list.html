<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PortFlow | Gestion des utilisateurs</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/top-header.css">
    <link rel="stylesheet" href="../../css/pages/users-list.css">
</head>
<body>
    <div id="page-content">
        <!-- Filtres -->
        <div class="filters-bar">
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Recherche</label>
                <input type="text" id="searchInput" placeholder="Nom, email..." autocomplete="off">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Rôle</label>
                <select id="roleFilter">
                    <option value="">Tous</option>
                    <option value="admin">Administrateur</option>
                    <option value="acheteur">Acheteur</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-toggle-on"></i> Statut</label>
                <select id="statusFilter">
                    <option value="">Tous</option>
                    <option value="actif">Actif</option>
                    <option value="inactif">Inactif</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn-reset" id="resetFiltersBtn">
                    <i class="fas fa-undo-alt"></i> Réinitialiser
                </button>
            </div>
        </div>
        
        <!-- Liste des utilisateurs -->
        <div class="card-panel">
            <div class="panel-header">
                <span class="panel-title"><i class="fas fa-users"></i> Utilisateurs</span>
                <button class="btn-red" id="newUserBtn">
                    <i class="fas fa-plus"></i> Nouvel utilisateur
                </button>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Statut</th>
                            <th>Date d'inscription</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Chargement...<\/td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/api/client.js"></script>
    <script src="../../js/api/users.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/top-header.js"></script>
    <script src="../../js/utils/components-loader.js"></script>
    <script src="../../js/modules/users/users-list.js"></script>
    
    <script>
        if (!Auth.isAuthenticated()) window.location.href = '../login.html';
        if (!Auth.isAdmin()) window.location.href = '../dashboard-acheteur.html';
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ComponentsLoader !== 'undefined') {
                await ComponentsLoader.init('admin');
                ComponentsLoader.setActiveSidebarItem('utilisateurs');
                ComponentsLoader.setPageTitle('Gestion des utilisateurs');
            }
        });
    </script>
</body>
</html>
