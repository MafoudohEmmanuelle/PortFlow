<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PortFlow | Utilisateur</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components/sidebar.css">
    <link rel="stylesheet" href="../../css/components/top-header.css">
    <link rel="stylesheet" href="../../css/pages/users-form.css">
</head>
<body>
    <div id="page-content">
        <!-- Bouton retour -->
        <div class="back-button-wrapper">
            <a href="list.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Retour à la liste
            </a>
        </div>
        
        <div class="form-card">
            <div id="formError" class="error-message"></div>
            <div id="formSuccess" class="success-message"></div>
            
            <form id="userForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom"><i class="fas fa-user"></i> Nom *</label>
                        <input type="text" id="nom" class="form-control" required placeholder="Nom complet">
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email *</label>
                        <input type="email" id="email" class="form-control" required placeholder="exemple@email.com">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="mot_de_passe"><i class="fas fa-lock"></i> Mot de passe <span id="passwordRequired">*</span></label>
                        <input type="password" id="mot_de_passe" class="form-control" placeholder="••••••••">
                        <small id="passwordHelp" style="color: #757575;">Laisser vide pour conserver le mot de passe actuel (en modification)</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="role"><i class="fas fa-tag"></i> Rôle *</label>
                        <select id="role" class="form-control" required>
                            <option value="acheteur">Acheteur</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="actif" checked>
                            <span>Compte actif</span>
                        </label>
                        <small style="color: #757575;">Un compte inactif ne peut pas se connecter</small>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='list.html'">Annuler</button>
                    <button type="submit" class="btn-save" id="submitBtn">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/api/client.js"></script>
    <script src="../../js/api/users.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/top-header.js"></script>
    <script src="../../js/utils/components-loader.js"></script>
    <script src="../../js/modules/users/users-form.js"></script>
    
    <script>
        if (!Auth.isAuthenticated()) window.location.href = '../login.html';
        if (!Auth.isAdmin()) window.location.href = '../dashboard-acheteur.html';
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ComponentsLoader !== 'undefined') {
                await ComponentsLoader.init('admin');
                ComponentsLoader.setActiveSidebarItem('utilisateurs');
                ComponentsLoader.setPageTitle('Utilisateur');
            }
        });
    </script>
</body>
</html>
