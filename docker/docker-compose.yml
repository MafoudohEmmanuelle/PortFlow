# docker/docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: portflow_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-portflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:                                    
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portflow_network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: portflow_backend
    env_file:
      - /.env                    
    environment:
      # Surcharger DATABASE_URL pour Docker
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portflow_network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: portflow_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - portflow_network

networks:
  portflow_network:

volumes:
  postgres_data: